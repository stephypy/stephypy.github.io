<!DOCTYPE html>
<html>
<head>
  <title>♪⭑૮ ･ ﻌ･ა ♡♪</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="simon_style.css">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <script src="prototype.js"></script>
</head>
<body>
  <div id="test-console" class="container-fluid">
    <div id="test-screen" class="container-fluid">
      <div id="test-score" class="container-fluid text-center">
        <h3 id="score" class="score">Score:</h3>
      </div>
      
      <div id="all-rect">
        <div class="row-rect">
            <button id="1" class="rect-1"></button>
            <button id="2" class="rect-2"></button>
          </div>
          <div class="row-rect">
            <button id="3" class="rect-3"></button>
            <button id="4" class="rect-4"></button>
          </div>
      </div>

      <div id="test-lose">
        <h3 id="gameover" class="gameover">Game Over</h3>
      </div>
    </div>
    <div id="test-start">
      <button id="start" class="start-button">Start</button>
    </div>    
  </div>
</body>
</html>
